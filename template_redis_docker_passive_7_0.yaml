    discovery_rules:
    - uuid: 1fd4fa9076604818afc6862fd5a80fe3
      name: 'Redis host: optional CPU'
      type: DEPENDENT
      key: rdm.host.discovery.cpu
      delay: '0'
      lifetime: 7d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'if ("{$REDIS.HOST.ENABLED}" !== "1" || "{$REDIS.HOST.CPU.ENABLED}" !==
          "1") return "[]"; return JSON.stringify([{ "{#SCOPE}": "host", "{#CPU}":
          "all", "{#PAVAILABLE}": "pavailable", "{#AVAILABLE}": "available" }]);'
      item_prototypes:
      - uuid: 972d322a0d654568bc40920186794981
        name: 'Redis host: CPU utilization'
        type: ZABBIX_PASSIVE
        key: system.cpu.util[{#CPU},idle]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: host
        units: '%'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - return 100 - Number(value);
      - uuid: 2ac35d9ce3a7458893b9628769fc432e
        name: 'Redis host: Load average 1m'
        type: ZABBIX_PASSIVE
        key: system.cpu.load[{#CPU},avg1]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: host
