    description: Passive Debian Docker Redis monitor v1.1.0. Requires rdm.collect
      UserParameter + Python collector. Host metrics default off. Set HOST.ENABLED=1
      to create optional host items; switch individual groups off to avoid duplicate
      keys. See README.
    groups:
    - name: Templates/Redis Docker
    items:
    - uuid: f07e7be580b844929aea0b1c7e7b2ad8
      name: 'Redis Docker: collector JSON'
      type: ZABBIX_PASSIVE
      key: rdm.collect["{$REDIS.CONTAINER}","{$REDIS.DATA.PATH}","{$REDIS.MOUNT.PATH}","{$REDIS.PORT}"]
      delay: 1m
      history: 1d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: collector
    - uuid: 096874989b96475aafc5b5c50798ee29
      name: 'Redis Docker: Collector successful'
      type: DEPENDENT
      key: rdm.collector_ok
      delay: '0'
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: collector
      master_item:
        key: rdm.collect["{$REDIS.CONTAINER}","{$REDIS.DATA.PATH}","{$REDIS.MOUNT.PATH}","{$REDIS.PORT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.collector_ok
