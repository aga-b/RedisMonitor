# Zabbix agent or Agent 2. Keep UnsafeUserParameters=0.
UserParameter=rdm.collect[*],/usr/bin/python3 /usr/local/lib/zabbix/redis_docker_collect.py "$1" "$2" "$3" "$4"
UserParameter=rdm.net.discovery[*],/usr/bin/python3 /usr/local/lib/zabbix/redis_docker_collect.py --discover network "$1" "$2"
UserParameter=rdm.disk.discovery[*],/usr/bin/python3 /usr/local/lib/zabbix/redis_docker_collect.py --discover disk "$1" "$2"
UserParameter=rdm.slowlog[*],/usr/bin/python3 /usr/local/lib/zabbix/redis_docker_collect.py --slowlog "$1" "$2" "$3"
